name: Kontroller pakken

on:
  # Only main: a sync or release also pushes a tag to the same commit, and a
  # second run would test nothing new.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Linux and Windows on every push and pull request. GitHub's macOS
    # machines are often not available, and a job that waits too long is
    # cancelled and turns main red with nothing wrong. macOS runs below when
    # the workflow is started by hand.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.8
      - run: python scripts/check-release

  check-macos:
    # Started by hand: Actions > Kontroller pakken > Run workflow.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.8
      - run: python scripts/check-release
